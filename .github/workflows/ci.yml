name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wallet_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet_test -d wallet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Build and test (including isolated PostgreSQL tests)
        run: >-
          mvn --batch-mode --no-transfer-progress verify
          '-Doutbox.test.jdbc=jdbc:postgresql://localhost:5432/wallet_test?user=wallet_test&password=ci-only-password'
          '-Dwithdrawal.test.jdbc=jdbc:postgresql://localhost:5432/wallet_test?user=wallet_test&password=ci-only-password'
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@10.28.2
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Check TypeScript (including generated Next.js types)
        run: pnpm exec tsc --noEmit

  containers:
    name: Container check (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: frontend
            context: frontend
          - image: nginx
            context: environment/nginx
          - image: media
            context: environment/media
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          load: ${{ matrix.image == 'nginx' }}
          tags: digitalwallet-ci/${{ matrix.image }}:check
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Check production Nginx TLS configuration
        if: matrix.image == 'nginx'
        shell: bash
        run: |
          cert_dir="$RUNNER_TEMP/certs/live/wallet.example.com"
          mkdir -p "$cert_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=wallet.example.com' \
            -keyout "$cert_dir/privkey.pem" -out "$cert_dir/fullchain.pem" 2>/dev/null
          docker run --rm --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 \
            -e DOMAIN=wallet.example.com -e 'NGINX_ENVSUBST_FILTER=^DOMAIN$' \
            -v "$GITHUB_WORKSPACE/environment/nginx/templates/prod.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$RUNNER_TEMP/certs:/etc/letsencrypt:ro" \
            digitalwallet-ci/nginx:check nginx -t

  production-config:
    name: Production config checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IMAGE_PREFIX: ghcr.io/tysonng/digitalwallet
      IMAGE_TAG: sha-0000000000000000000000000000000000000000
      DOMAIN: wallet.example.com
      POSTGRES_USER: ci_validate
      POSTGRES_PASSWORD: validation-only
      TOKEN_SECRET: validation-only-123456789012345678901234567890
      SESSION_SECRET: validation-only-123456789012345678901234567890
      MAIL_USERNAME: validation@example.com
      MAIL_PASSWORD: validation-only
      MINIO_ROOT_USER: validation
      MINIO_ROOT_PASSWORD: validation-only
      MEDIA_S3_ACCESS_KEY: validation
      MEDIA_S3_SECRET_KEY: validation-only
      GRAFANA_ADMIN_PASSWORD: validation-only
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate production Compose without printing credentials
        run: docker compose -f environment/docker-compose.prod.yml config --quiet
      - name: Check deployment script syntax
        run: bash -n environment/scripts/deploy.sh environment/scripts/backup-db.sh
