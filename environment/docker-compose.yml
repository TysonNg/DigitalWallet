name: digital-wallet
services:
  nginx:
    image: digital-wallet-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: digital_wallet_nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - digital-wallet-network

  backend:
    image: digital-wallet-backend:latest
    build:
      context: ../backend
    # container_name: digital_wallet_backend # Disabled to allow scaling (--scale backend=N)
    restart: always
    expose:
      - "3006"
    ports:
      - "3006:3006"
      - "8080:3006"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-digital_wallet}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-admin123}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - TOKEN_SECRET=${TOKEN_SECRET}
      - ACCESS_TOKEN_EXPIRATION=${ACCESS_TOKEN_EXPIRATION}
      - REFRESH_TOKEN_EXPIRATION=${REFRESH_TOKEN_EXPIRATION}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID:-}
      - PAYOS_API_KEY=${PAYOS_API_KEY:-}
      - PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_CONNECT_WEBHOOK_SECRET=${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      - MEDIA_ENABLED=true
      - MEDIA_S3_ENDPOINT=http://minio:9000
      - MEDIA_S3_REGION=us-east-1
      - MEDIA_S3_PATH_STYLE=true
      - MEDIA_S3_BUCKET=${MEDIA_S3_BUCKET:-digital-wallet-media}
      - MEDIA_S3_ACCESS_KEY=${MEDIA_S3_ACCESS_KEY:?Set MEDIA_S3_ACCESS_KEY}
      - MEDIA_S3_SECRET_KEY=${MEDIA_S3_SECRET_KEY:?Set MEDIA_S3_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - digital-wallet-network

  frontend:
    image: digital-wallet-frontend:latest
    build:
      context: ../frontend
      dockerfile: Dockerfile
    # container_name: digital_wallet_frontend # Disabled to allow scaling (--scale frontend=N)
    restart: always
    expose:
      - "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - SPRING_BOOT_URL=${SPRING_BOOT_INTERNAL_URL:-http://backend:3006/api/v1}
      - SESSION_SECRET=${SESSION_SECRET:-digital_wallet_secret_session_key_32_characters_minimum_length_required}
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_started
    networks:
      - digital-wallet-network

  minio:
    image: digital-wallet-minio:local
    build:
      context: ./media
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - media_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - digital-wallet-network

  minio-init:
    image: digital-wallet-minio:local
    build:
      context: ./media
    entrypoint: ["/bin/sh", "/init/init.sh"]
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-digital-wallet-media}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?Set MEDIA_S3_ACCESS_KEY}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?Set MEDIA_S3_SECRET_KEY}
    volumes:
      - ./media/init.sh:/init/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - digital-wallet-network

  pg_admin:
    image: dpage/pgadmin4
    container_name: digital_wallet_pgadmin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@digitalwallet.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - digital-wallet-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: digital_wallet_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_wallet}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-digital_wallet}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - digital-wallet-network

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      # Only expose the client listener to this computer.
      - "127.0.0.1:9092:9092"
    environment:
      # KRaft: the same local node stores messages and manages cluster metadata.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: FYJBDcjx0_OBuUxsb5Y3cg
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # LISTENERS binds sockets; ADVERTISED_LISTENERS tells clients where to reconnect.
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # One broker means internal topics can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:19092"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      - digital-wallet-network

  redis:
    image: redis:7-alpine
    container_name: digital_wallet_redis
    restart: always
    depends_on:
      - postgres
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - digital-wallet-network

  prometheus:
    image: prom/prometheus:latest
    container_name: digital-wallet-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - digital-wallet-network

  grafana:
    image: grafana/grafana:latest
    container_name: digital_wallet_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - digital-wallet-network

volumes:
  media_data:
  kafka_data:
  postgres_data:
  redis_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:

networks:
  digital-wallet-network:
    driver: bridge
