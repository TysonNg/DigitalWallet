# Standalone production file; do not merge with the local Compose file.
name: digital-wallet-prod
services:
  nginx:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-nginx:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: always
    volumes:
      - ./nginx/templates/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:80/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - digital-wallet-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      NGINX_ENVSUBST_FILTER: ^DOMAIN$
  backend:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-backend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: always
    expose:
      - "3006"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-digital_wallet}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:?Set POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - TOKEN_SECRET=${TOKEN_SECRET:?Set TOKEN_SECRET}
      - ACCESS_TOKEN_EXPIRATION=${ACCESS_TOKEN_EXPIRATION:-900000}
      - REFRESH_TOKEN_EXPIRATION=${REFRESH_TOKEN_EXPIRATION:-604800000}
      - MAIL_USERNAME=${MAIL_USERNAME:?Set MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD:?Set MAIL_PASSWORD}
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID:-}
      - PAYOS_API_KEY=${PAYOS_API_KEY:-}
      - PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_CONNECT_WEBHOOK_SECRET=${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      - FRONTEND_PUBLIC_URL=https://${DOMAIN:?Set DOMAIN}
      - MEDIA_ENABLED=true
      - MEDIA_S3_ENDPOINT=http://minio:9000
      - MEDIA_S3_REGION=us-east-1
      - MEDIA_S3_PATH_STYLE=true
      - MEDIA_S3_BUCKET=${MEDIA_S3_BUCKET:-digital-wallet-media}
      - MEDIA_S3_ACCESS_KEY=${MEDIA_S3_ACCESS_KEY:?Set MEDIA_S3_ACCESS_KEY}
      - MEDIA_S3_SECRET_KEY=${MEDIA_S3_SECRET_KEY:?Set MEDIA_S3_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-demo-key}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_JPA_SHOW_SQL=false
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,prometheus
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=never
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60.0
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - digital-wallet-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - curl
        - "--fail"
        - "--silent"
        - http://localhost:3006/api/v1/actuator/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    stop_grace_period: 40s
  frontend:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: always
    expose:
      - "3000"
    environment:
      - SPRING_BOOT_URL=http://backend:3006/api/v1
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET}
      - COOKIE_SECURE=true
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - digital-wallet-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - fetch('http://127.0.0.1:3000/vi').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_wallet}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - digital-wallet-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  redis:
    image: redis:7-alpine
    restart: always
    depends_on:
      - postgres
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - digital-wallet-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command:
      - redis-server
      - "--appendonly"
      - "yes"
  kafka:
    restart: unless-stopped
    image: apache/kafka:4.1.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: FYJBDcjx0_OBuUxsb5Y3cg
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-broker-api-versions.sh
        - "--bootstrap-server"
        - kafka:19092
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      - digital-wallet-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  minio:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-media:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - media_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - digital-wallet-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  minio-init:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-media:${IMAGE_TAG:?Set IMAGE_TAG}
    entrypoint:
      - /bin/sh
      - /init/init.sh
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-digital-wallet-media}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?Set MEDIA_S3_ACCESS_KEY}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?Set MEDIA_S3_SECRET_KEY}
    volumes:
      - ./media/init.sh:/init/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - digital-wallet-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - digital-wallet-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    profiles:
      - observability
    ports:
      - 127.0.0.1:9090:9090
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - digital-wallet-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    profiles:
      - observability
    ports:
      - 127.0.0.1:3001:3000
volumes:
  media_data: null
  postgres_data: null
  redis_data: null
  kafka_data: null
  prometheus_data: null
  grafana_data: null
networks:
  digital-wallet-network:
    driver: bridge
