# ==============================================================================
# Upstream Load Balancing Clusters
# ==============================================================================

# Backend Spring Boot Cluster (Load Balanced with least_conn)
upstream backend_cluster {
    least_conn;
    server backend:3006 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Frontend Next.js Cluster (Load Balanced with least_conn)
upstream frontend_cluster {
    least_conn;
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ==============================================================================
# HTTP Server (Port 80) -> Redirect All Traffic to HTTPS
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Health check endpoint on port 80 (for lightweight Docker/ALB probes)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ACME-challenge location for Let's Encrypt / Certbot automated renewals
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# HTTPS Server (Port 443) -> SSL/TLS Termination Gateway
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost;

    # SSL Certificate & Private Key (Auto-generated self-signed or Let's Encrypt)
    ssl_certificate /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;

    # Client Request Body Limits
    client_max_body_size 25M;

    # Security & HSTS Headers (OWASP Recommended)
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --------------------------------------------------------------------------
    # Health Check Endpoint
    # --------------------------------------------------------------------------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # --------------------------------------------------------------------------
    # Backend WebSocket Proxy (/api/v1/ws) - STOMP Realtime Notifications (WSS)
    # --------------------------------------------------------------------------
    location /api/v1/ws {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Forwarded Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Keep alive WebSocket connection without timeout disconnects
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Backend Spring Boot REST API (/api/v1/)
    # --------------------------------------------------------------------------
    location /api/v1 {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;

        # Standard Forwarded Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Connection reuse for HTTP keepalive
        proxy_set_header Connection "";

        # Automatic failover between backend replicas
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Proxy Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # --------------------------------------------------------------------------
    # Next.js Static Assets Optimization (/_next/static/)
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://frontend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # Frontend Next.js Web Application (BFF & SSR)
    # Catches all other routes (/, /dashboard, /auth, /api/ai/..., etc.)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_cluster;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support for Next.js HMR or live components
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Automatic failover between frontend replicas
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Proxy Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
