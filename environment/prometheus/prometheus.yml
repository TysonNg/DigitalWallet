
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'digital-wallet-prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['prometheus:9090']
    metrics_path: '/metrics'

  - job_name: 'digital-wallet-backend'
    metrics_path: '/api/v1/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['backend:3006']
        labels:
          application: 'digital-wallet'
          environment: 'development'
