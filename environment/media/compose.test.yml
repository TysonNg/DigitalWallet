# Isolated test services only; never connects to the main application database.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: media_test
      POSTGRES_USER: media_test
      POSTGRES_PASSWORD: ${MEDIA_TEST_DB_PASSWORD:?Set MEDIA_TEST_DB_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - test_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_test -d media_test"]
      interval: 2s
      timeout: 3s
      retries: 40
  minio:
    image: digital-wallet-minio:local
    environment:
      MINIO_ROOT_USER: media_test_root
      MINIO_ROOT_PASSWORD: ${MEDIA_TEST_ROOT_PASSWORD:?Set MEDIA_TEST_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:19000:9000"
    volumes:
      - test_media:/data
    labels:
      digitalwallet.test-purpose: media-integration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 40
  minio-init:
    image: digital-wallet-minio:local
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      MINIO_ROOT_USER: media_test_root
      MINIO_ROOT_PASSWORD: ${MEDIA_TEST_ROOT_PASSWORD:?Set MEDIA_TEST_ROOT_PASSWORD}
      MEDIA_S3_BUCKET: digital-wallet-media
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?Set MEDIA_S3_ACCESS_KEY}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?Set MEDIA_S3_SECRET_KEY}
    volumes:
      - ./init.sh:/init/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
volumes:
  test_media:
  test_postgres: