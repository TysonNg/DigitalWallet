spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    servlet:
      path: "/api/v1"
  application:
    name: digital-wallet
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${spring.application.name}
    # Application-defined extensions, bound by KafkaBusinessProperties (not Boot built-ins).
    provisioning:
      enabled: ${KAFKA_TOPIC_PROVISIONING_ENABLED:true}
    topics:
      withdrawal-process:
        name: ${WITHDRAWAL_KAFKA_TOPIC:wallet.withdrawal.process.v1}
        partitions: ${WITHDRAWAL_KAFKA_PARTITIONS:3}
        replication-factor: ${WITHDRAWAL_KAFKA_REPLICATION_FACTOR:1}
      withdrawal-process-dlt:
        name: ${WITHDRAWAL_KAFKA_DLT_TOPIC:wallet.withdrawal.process.v1.dlt}
        partitions: ${WITHDRAWAL_KAFKA_PARTITIONS:3}
        replication-factor: ${WITHDRAWAL_KAFKA_REPLICATION_FACTOR:1}
    withdrawal-consumer:
      retry-interval: 1s
      retries: 2
      dlt-ack-timeout: 12s
    outbox:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:20}
      poll-interval: ${OUTBOX_PUBLISHER_POLL_INTERVAL:1s}
      initial-delay: 5s
      ack-timeout: 12s
      initial-backoff: 1s
      max-backoff: 5m
    groups:
      withdrawal-worker: ${WITHDRAWAL_KAFKA_GROUP_ID:wallet-withdrawal-workers}
    admin:
      fail-fast: true
      properties:
        "[request.timeout.ms]": 5000
        "[default.api.timeout.ms]": 10000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 5000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: POSTGRESQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/digital_wallet}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      timeout: ${OPENAI_TIMEOUT:10s}
      max-retries: 0
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.3
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        initialize-schema: false
        table-name: vector_store
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        index-type: HNSW
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@gmail.com}
    password: ${MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
jwt:
  secret: ${TOKEN_SECRET:secret12345678901234567890123456789012}
  access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}
  cookie:
    secure: ${JWT_COOKIE_SECURE:false}
payment:
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    connect-webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:}

resilience4j:
  ratelimiter:
    instances:
      authRateLimiter:
        limitForPeriod: 5
        limitRefreshPeriod: 1m
        timeoutDuration: 0
        registerHealthIndicator: true
      transferRateLimiter:
        limitForPeriod: 10
        limitRefreshPeriod: 1m
        timeoutDuration: 0
        registerHealthIndicator: true
      lookupRateLimiter:
        limitForPeriod: 20
        limitRefreshPeriod: 1m
        timeoutDuration: 0
        registerHealthIndicator: true
  circuitbreaker:
    instances:
      payosPayment:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      stripePayment:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      mailSender:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 60
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 2
        registerHealthIndicator: true
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 3006

withdrawal:
  processing-mode: ${WITHDRAWAL_PROCESSING_MODE:kafka}

# Media is opt-in outside the local Docker environment.
media:
  enabled: ${MEDIA_ENABLED:false}
  frontend-public-url: ${FRONTEND_PUBLIC_URL:http://localhost:3000}
  s3:
    endpoint: ${MEDIA_S3_ENDPOINT:}
    region: ${MEDIA_S3_REGION:us-east-1}
    bucket: ${MEDIA_S3_BUCKET:digital-wallet-media}
    access-key: ${MEDIA_S3_ACCESS_KEY:}
    secret-key: ${MEDIA_S3_SECRET_KEY:}
    path-style: ${MEDIA_S3_PATH_STYLE:false}
