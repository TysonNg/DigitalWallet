spring:
  mvc:
    servlet:
      path: "/api/v1"
  application:
    name: digital-wallet
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: POSTGRESQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/digital_wallet}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@gmail.com}
    password: ${MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
jwt:
  secret: ${TOKEN_SECRET:secret12345678901234567890123456789012}
  access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}
  cookie:
    secure: ${JWT_COOKIE_SECURE:false}
payment:
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

resilience4j:
    circuitbreaker:
        instances:
            backendA:
                registerHealthIndicator: true
                slidingWindowSize: 100
            backendB:
                registerHealthIndicator: true
                slidingWindowSize: 10
                permittedNumberOfCallsInHalfOpenState: 3
                slidingWindowType: TIME_BASED
                minimumNumberOfCalls: 20
                waitDurationInOpenState: 50s
                failureRateThreshold: 50
                eventConsumerBufferSize: 10
                recordFailurePredicate: io.github.robwin.exception.RecordFailurePredicate
    ratelimiter:
        instances:
            backendA:
                limitForPeriod: 10
                limitRefreshPeriod: 1s
                timeoutDuration: 0
                registerHealthIndicator: true
                eventConsumerBufferSize: 100
            backendB:
                limitForPeriod: 6
                limitRefreshPeriod: 500ms
                timeoutDuration: 3s
management:
    
server:
  port: 3006